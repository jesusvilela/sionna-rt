name: Research CPU regression (no Sionna or GPU)

on:
  push:
    branches:
      - research/cpu-clean-checkout-regression-2026-11-09
      - research/printed-high-precision-recheck-2026-11-09
      - research/receiver-partial-identification-2026-11-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout fork research branch
        uses: actions/checkout@v4
      - name: Set up CPU Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only CPU numerical dependencies
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: \
            numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 mpmath==1.3.0
      - name: Independently regenerate and verify the frozen 75-cell input
        run: |
          python research/experiments/gram_decision_sweep.py --out /tmp/frozen_sionna_gram.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = '16ad7ca1eda73d9c6a73776555be2f93333d248ad44d11a32ac9be3b05d2f4c6'
          actual = hashlib.sha256(Path('/tmp/frozen_sionna_gram.json').read_bytes()).hexdigest()
          print('Frozen synthetic Gram SHA256:', actual)
          assert actual == expected, (expected, actual)
          PY
      - name: Run entire research unittest suite without an archived fixture
        run: |
          test ! -e research/experiments/gram_sweep_2026-11-04.json
          python -m unittest discover -s research/tests -p 'test_*.py' -v
      - name: Independently recompute printed H at 80-digit precision
        run: |
          python research/experiments/independent_printed_precision.py --out /tmp/printed_precision_check.json
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('/tmp/printed_precision_check.json').read_text())
          assert x['all_comparisons_passed'] is True
          assert x['precision_decimal_digits']==80
          assert len(x['comparisons'])==4
          print('Printed precision gate: 4/4, single printed H plus balanced negative control')
          PY
      - name: Verify two synthetic aggregate counterworld certificates
        run: |
          python research/experiments/receiver_partial_identification.py --out /tmp/partial_identification.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/partial_identification.json').read_text())
          assert x['real_original_munich_matrices_recovered']==0
          assert x['not_independently_verified_munich_data']
          for key,w in x['worlds'].items():
              for comparator,c in w['comparisons'].items():
                  expected='rank_one' if key.startswith('A_') else comparator
                  assert c['winner']==expected, (key,comparator,c)
                  assert c['gap']>1e-4
          print('Two 16-slot mathematical completion certificates: 4/4 correct, 0 real Munich channels')
          PY
