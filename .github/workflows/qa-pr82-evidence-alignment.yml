name: Research PR82 evidence-alignment preflight (no GPU)

on:
  push:
    branches:
      - qa/pr82-evidence-alignment-2026-11-17
    paths:
      - research/verify_pr82_notebook.py
      - .github/workflows/qa-pr82-evidence-alignment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch preserved original PR82 for immutable comparison
        run: |
          git fetch --no-tags origin refs/heads/archive/rt-pr82-pre-dco-2026-11-17:refs/remotes/origin/pr82-archive
          git rev-parse refs/remotes/origin/pr82-archive
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.py }}"
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.3.5" "nbformat==5.10.4"
      - name: Validate official Jupyter notebook JSON schema
        run: |
          python -c 'import nbformat; nb = nbformat.read("tutorials/Null-Cone-Constellations.ipynb", as_version=4); nbformat.validate(nb); print("nbformat validation passed:", len(nb.cells), "cells")'
      - name: Verify preserved original outputs and CPU constellation math
        run: |
          python research/verify_pr82_notebook.py \
            --archived-ref refs/remotes/origin/pr82-archive \
            --result research/results/pr82_notebook_preflight_${{ matrix.py }}.json
      - name: Upload non-GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr82-evidence-alignment-python-${{ matrix.py }}
          path: research/results/pr82_notebook_preflight_${{ matrix.py }}.json
          if-no-files-found: warn
          retention-days: 30
